<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="app.css" rel="stylesheet">
        <title>Welcome to the Chat!</title>
    </head>
    <body background="chat.jpg">
        <h1 class="centered" id="welcome">What Do You Wanna Talk About?</h1>
        <h3 class="centered" id="user">Enter Your Username and Password:</h3>
        <p class="centered">
            <input autocomplete="on" class="submit" type="text" autofocus name="username" placeholder="Username" required>

            <button>Enter</button>
        </p>
        <img src="xlogo.png" alt="X">
    </body>
</html>
